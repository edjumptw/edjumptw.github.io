<script>
(function () {
  // 404 智慧導流：舊路由、少了斜線、尾端夾帶中文標點（例如「/）」）都導回現行頁面，保留 ?utm 與 #hash
  var PAGES = [
    "/", "/jump-ai/", "/gift/", "/claude-draw/", "/grok-bot-guide/",
    "/jump-ai/gift/", "/jump-ai/claude-draw/", "/jump-ai/grok-bot-guide/",
    "/kma-kk/", "/kma-kk/ai/", "/kma-kk/live/", "/kma-kk/talks/", "/kma-kk/talks/1119/",
    "/kma-kk/gift/", "/kma-kk/grok-bot-guide/", "/kma-kk/mom-finance/", "/kma-kk/mom-finance-1203/",
    "/kma-kk/diagnosis/", "/me/", "/small-talk/", "/2026events/", "/cross-strait-map/"
  ];
  var ALIAS = [
    [/^\/tma-kk-courses\//, "/kma-kk/"],
    [/^\/(mom-finance-1203|mom-finance|talks|diagnosis|ai|live|p)\//, "/kma-kk/$1/"],
    [/^\/kma-kk\/claude-draw\//, "/jump-ai/claude-draw/"],
    [/^\/kma-kk\/jump-ai\//, "/jump-ai/"],
    [/^\/(momfinance|mom_finance|mom-finance1203|momfinance1203)\//, "/kma-kk/mom-finance-1203/"],
    [/^\/kma-kk\/(momfinance|mom_finance|mom-finance1203|momfinance1203)\//, "/kma-kk/mom-finance-1203/"],
    [/^\/(claudedraw|claude_draw|draw|lucky-draw)\//, "/jump-ai/claude-draw/"],
    [/^\/(gifts|jump-ai\/gifts)\//, "/jump-ai/gift/"],
    [/^\/kma-kk\/gifts\//, "/kma-kk/gift/"],
    [/^\/(grok|grokbot|grok-bot)\//, "/jump-ai/grok-bot-guide/"],
    [/^\/kma-kk\/p\/[^\/]*\//, "/kma-kk/"]
  ];
  var raw = location.pathname, p = raw;
  try { p = decodeURIComponent(raw); } catch (e) {}
  p = p.replace(/[^\x21-\x7e]+.*$/, "")          // 去掉尾端中文標點、全形括號、空白
       .replace(/[.,;:!'")\]]+$/, "")
       .toLowerCase()
       .replace(/\/index\.html?$/, "/")
       .replace(/\.html?$/, "")
       .replace(/\/{2,}/g, "/");
  if (p.charAt(p.length - 1) !== "/") p += "/";
  for (var i = 0; i < ALIAS.length; i++) {
    if (ALIAS[i][0].test(p)) { p = p.replace(ALIAS[i][0], ALIAS[i][1]); break; }
  }
  // 找最接近的現行頁面（最長前綴）
  var target = "/";
  for (var j = 0; j < PAGES.length; j++) {
    if (p.indexOf(PAGES[j]) === 0 && PAGES[j].length > target.length) target = PAGES[j];
  }
  window.__target = target + location.search + location.hash;
  if (target !== raw) location.replace(window.__target);
})();
</script>
