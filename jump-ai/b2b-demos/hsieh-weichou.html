{tab:'小人提補助試算',type:'calc',heading:'小人提 10 萬內訓補助試算',desc:'輸入公司規模與規劃的 AI 內訓費用，即時試算可申請補助與企業自付金額。',
 inputs:[{key:'emp',label:'就業保險投保員工人數',value:35},{key:'cost',label:'AI 內訓規劃總費用（元）',value:120000,step:'1000'},{key:'people',label:'預計參訓人數',value:20}],
 outputs:[

  {label:'企業自付金額',hint:'總費用扣除預估補助',calc:function(v){var s=v.emp>0&&v.emp<=50?Math.min(v.cost,100000):0;return B2B.money(Math.max(v.cost-s,0))}},

 note:'試算僅供規劃參考。小型企業人力提升計畫以就業保險投保人數 50 人以下之事業單位為對象，實際資格、補助比例與金額以勞動部勞動力發展署當年度公告及核定結果為準。',

]};
